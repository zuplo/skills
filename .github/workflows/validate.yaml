name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated skill metadata
        run: ./scripts/sync-skill-metadata.sh --check

      - name: Check plugin manifests
        run: python3 scripts/check-plugin-manifests.py
